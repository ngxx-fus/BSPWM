Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"

    # Enable tap-to-click
    Option "Tapping" "on"

    # Tap mapping: 1 finger = Left, 2 fingers = Right, 3 fingers = Middle
    Option "TappingButtonMap" "lrm"

    # Physical click: 1 finger = Left, 2 fingers = Right, 3 fingers = Middle
    Option "ClickMethod" "clickfinger"

    # Enable natural scrolling
    Option "NaturalScrolling" "true"

    # Enable two-finger scrolling
    Option "ScrollMethod" "twofinger"

    # Enable tap-and-drag
    Option "TappingDrag" "on"
EndSection
