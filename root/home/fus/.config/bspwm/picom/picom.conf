#################################
#             Shadows           #
#################################

shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 1.0;

#################################
#           Corners             #
#################################

corner-radius = 0;

#################################
#     Background-Blurring       #
#################################

# Blur is disabled by default for maximum performance.
# To enable on GLX backend, uncomment below:
# blur-method = "dual_kawase";
# blur-strength = 5;
# blur-background = true;

#################################
#    FAST SNAPPY ANIMATIONS     #
#################################

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.10;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.10;
  }
  # Note: "geometry" trigger is disabled to prevent rubber-banding lag
  # when dragging/resizing floating windows with Super + Mouse in bspwm.
  # {
  #   triggers = ["geometry"];
  #   preset = "geometry-change";
  #   duration = 0.10;
  # }
);

#################################
#       General Settings        #
#################################

# "xrender" is the safe default and works everywhere (incl. VMs / software
# rendering). On Intel/AMD/NVIDIA GLX provides hardware-accelerated compositing
# and tear-free VSync.
backend = "glx";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

#################################
#         Window Rules          #
#################################

rules: ({
  # No shadows on notifications, docks, drag-and-drop, and GTK frame windows
  match = "name = 'Notification'   || "
          "class_g ?= 'Notify-osd' || "
          "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "window_type = 'dnd'     || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  # No blur on dock, desktop, menus, tooltips, and GTK frames
  match = "window_type = 'dock'          || "
          "window_type = 'desktop'       || "
          "window_type = 'popup_menu'    || "
          "window_type = 'dropdown_menu' || "
          "window_type = 'tooltip'       || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  # No rounded corners on dock, desktop, and fullscreen windows
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "fullscreen";
  corner-radius = 0;
}, {
  # Menus, dialogs, tooltips, notifications, docks, overlays:
  # instant appear, no animation, no fade (Picom v13 syntax)
  match = "window_type = 'popup_menu'    || "
          "window_type = 'dropdown_menu' || "
          "window_type = 'menu'          || "
          "window_type = 'tooltip'       || "
          "window_type = 'dialog'        || "
          "window_type = 'notification'  || "
          "window_type = 'dock'          || "
          "window_type = 'desktop'       || "
          "window_type = 'dnd'           || "
          "window_type = 'utility'       || "
          "window_type = 'splash'        || "
          "class_g ?= 'skippy-xd'        || "
          "class_g ?= 'flameshot'        || "
          "class_g ?= 'slop'";
  fade = false;
  animations = (
    {
      triggers = ["open", "show", "close", "hide", "geometry"];
    }
  );
}, {
  # Menus and tooltips: slight transparency and rounded corner clipping
  match = "window_type = 'popup_menu'    || "
          "window_type = 'dropdown_menu' || "
          "window_type = 'menu'          || "
          "window_type = 'tooltip'";
  opacity = 0.95;
  corner-radius = 8;
}, {
  # Tooltip shadow
  match = "window_type = 'tooltip'";
  shadow = true;
  full-shadow = false;
}, {
  # Dim only normal unfocused windows (ignores fullscreen on 2nd monitor, Polybar, Dunst, etc.)
  match = "!focused && !fullscreen && window_type = 'normal'";
  opacity = 0.95;
}, {
  # Geany opacity (overrides unfocused dimming so Geany stays 100% opaque)
  match = "class_g = 'Geany'";
  opacity = 1.0;
})
