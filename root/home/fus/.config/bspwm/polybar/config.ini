;
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;
;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar
;
;   The README contains a lot of information
;
;==========================================================

[colors]
background = #161616
background-alt = #282828
foreground = #C5C8C6
primary = #50a5f5
secondary = #52bdff
alert = #ebf831
disabled = #4e5b55
border = #0f2923

[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 2
padding-right = 2

module-margin = 1

; font-0 = Roboto Mono Nerd Font:size=11:weight=medium;3
; font-1 = "JetBrainsMono Nerd Font:size=10"
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Symbols Nerd Font:size=11;2"

modules-left = launcher sep bspwm
modules-center = xwindow
modules-right = sep date hour sep memory cpu-temp sep lock wlan eth input_method bluetooth pulseaudio backlight_ext battery_icon_only battery-detail powermenu 

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true



;==========================================================;
[module/launcher]
type = custom/text
format = 
format-foreground = ${colors.primary}
format-padding = 0
click-left = xfce4-appfinder &

;==========================================================;
[module/sep]
type = custom/text
format = |
format-foreground = ${colors.disabled}

;==========================================================;
[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

;==========================================================;
[module/xwindow]
type = internal/xwindow
label = %title:0:75:...%

;==========================================================;
[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

;==========================================================;
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 1

; Bọc chuột trái (A1: pavucontrol), chuột phải (A3: mute), cuộn lên (A4), cuộn xuống (A5)
format-volume = %{A1:pavucontrol &:}%{A3:/home/fus/.config/bspwm/scripts/Helper-ChangeVolume mute &:}%{A4:/home/fus/.config/bspwm/scripts/Helper-ChangeVolume up &:}%{A5:/home/fus/.config/bspwm/scripts/Helper-ChangeVolume down &:}<ramp-volume> <label-volume>%{A}%{A}%{A}%{A}
format-volume-foreground = ${colors.foreground}

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

format-muted = %{A1:pavucontrol &:}%{A3:/home/fus/.config/bspwm/scripts/Helper-ChangeVolume mute &:}%{A4:/home/fus/.config/bspwm/scripts/Helper-ChangeVolume up &:}%{A5:/home/fus/.config/bspwm/scripts/Helper-ChangeVolume down &:}<label-muted>%{A}%{A}%{A}%{A}
format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = "Muted"
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}

;==========================================================;
[module/backlight]
type = internal/backlight

; Use the following command to list available cards:
; ls -1 /sys/class/backlight/
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp> <label>
format-foreground = ${colors.foreground}

label = %percentage%%
label-foreground = ${colors.foreground}

ramp-0 = 󰃞
ramp-1 = 󰃝
ramp-2 = 󰃟
ramp-3 = 󰃠
ramp-foreground = ${colors.primary}

;==========================================================;
[module/backlight_ext]
type = custom/script
exec = ~/.config/polybar/scripts/backlight_check.sh
interval = 1

format = <label>
format-prefix = "󰃠 "
format-prefix-foreground = ${colors.primary}

label = %output%
label-foreground = ${colors.foreground}

scroll-up = ~/.config/bspwm/scripts/Helper-ChangeBrightness up
scroll-down = ~/.config/bspwm/scripts/Helper-ChangeBrightness down

;==========================================================;
[module/battery-detail]
type = custom/script
exec = /home/fus/.config/polybar/scripts/power_stat
interval = 1

click-left = alacritty -e watch -n 1 upower -i /org/freedesktop/UPower/devices/battery_BAT1

format-foreground = ${colors.foreground}
format-background = ${colors.background}

;==========================================================;
[module/battery_icon_only]
type = internal/battery
full-at = 99
low-at = 15

battery = BAT1
adapter = ACAD
poll-interval = 1

format-charging = <animation-charging>
format-discharging = <ramp-capacity>
format-full = <ramp-capacity>
format-low = <animation-low>

ramp-capacity-0 =  
ramp-capacity-1 =  
ramp-capacity-2 =  
ramp-capacity-3 =  
ramp-capacity-4 =  
ramp-capacity-foreground = ${colors.secondary}

animation-charging-0 =  
animation-charging-1 =  
animation-charging-2 =  
animation-charging-3 =  
animation-charging-4 =  
animation-charging-foreground = ${colors.secondary}
animation-charging-framerate = 750

animation-low-0 =  
animation-low-1 = "  "
animation-low-foreground = ${colors.alert}
animation-low-framerate = 500

;==========================================================;
[module/battery]
type = internal/battery
full-at = 99
low-at = 15

battery = BAT1
adapter = ACAD
poll-interval = 1

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%
label-charging-foreground = ${colors.foreground}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

format-full-prefix = "  "
format-full-prefix-foreground = ${colors.primary}
label-full = %percentage%%

format-low = <animation-low> <label-low>
label-low = %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 =  
ramp-capacity-1 =  
ramp-capacity-2 =  
ramp-capacity-3 =  
ramp-capacity-4 =  
ramp-capacity-foreground = ${colors.secondary}

animation-charging-0 =  
animation-charging-1 =  
animation-charging-2 =  
animation-charging-3 =  
animation-charging-4 =  
animation-charging-foreground = ${colors.secondary}
animation-charging-framerate = 750

animation-low-0 =  
animation-low-1 = "  "
animation-low-foreground = ${colors.alert}
animation-low-framerate = 500

;==========================================================;
[module/input_method]
type = custom/script
exec = zsh -c 'IM=$(fcitx5-remote -n); if [ "$IM" = "bamboo" ] || [ "$IM" = "unikey" ]; then echo "VN"; else echo "EN"; fi'
interval = 0.2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %output%
click-left = fcitx5-remote -t

;==========================================================;
[module/lock]
type = internal/xkeyboard
format-margin = 0
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-indicator>
label-indicator-padding = 0
indicator-icon-0 = caps lock;-CL;+CL
label-indicator-off =
label-indicator-on = "  Caps "
format-foreground = ${colors.background}
format-background = ${colors.alert}

;==========================================================;
[module/memory]
type = internal/memory
interval = 2
format = %{A1:alacritty --class "btop-term,btop-term" -e btop &:} <label>%{A}
format-foreground = ${colors.primary}
label = %percentage_used:2%%
label-foreground = ${colors.foreground}

;==========================================================;
[module/cpu]
type = internal/cpu
interval = 2
format = %{A1:alacritty --class "btop-term,btop-term" -e htop &:} <label>%{A}
format-foreground = ${colors.primary}
label = %percentage:2%%
label-foreground = ${colors.foreground}

;==========================================================;
; Module gộp cả %CPU và Nhiệt độ (TEMP)
;==========================================================;
[module/cpu-temp]
type = custom/script
exec = /home/fus/.config/bspwm/scripts/Helper-CpuTemp
interval = 2
format = %{A1:alacritty --class "btop-term,btop-term" -e htop &:} <label>%{A}
format-foreground = ${colors.primary}
label = %output%
label-foreground = ${colors.foreground}

;==========================================================;
; Module Nhiệt độ độc lập (dùng internal/temperature của Polybar)
;==========================================================;
[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
warn-temperature = 75
units = true

format = %{A1:alacritty --class "btop-term,btop-term" -e htop &:}<ramp> <label>%{A}
format-foreground = ${colors.primary}
format-warn = %{A1:alacritty --class "btop-term,btop-term" -e htop &:}<ramp> <label-warn>%{A}
format-warn-foreground = ${colors.alert}

label = %temperature-c%
label-foreground = ${colors.foreground}

label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.primary}

;==========================================================;
[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

;==========================================================;
[module/wlan]
inherit = network-base
interface-type = wireless
interval = 3.0

format-connected = %{A1:nm-connection-editor &:}<ramp-signal> <label-connected>%{A}
label-connected = %essid%
label-connected-foreground = ${colors.foreground}

format-disconnected = %{A1:alacritty --class "float-term" -e nmtui-connect &:}󰤮%{A}
format-disconnected-foreground = ${colors.primary}

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.primary}

;==========================================================;
[module/eth]
inherit = network-base
interface-type = wired

; Format when ethernet cable is plugged and active
format-connected = <label-connected>
label-connected = " "
label-connected-foreground = ${colors.primary}

; Format when disconnected (leave empty to hide completely)
format-disconnected =

click-left = alacritty --class "float-term" -e nmtui

;;;;;;;;;;;;;;;; CENTER MODULES ;;;;;;;;;;;;;;;;

;==========================================================;
[module/hour]
type = internal/date
interval = 5
label-foreground = ${colors.foreground}
date = %l:%M %p
label = %date%
label-padding = 0
label-font = 1

;==========================================================;
[module/date]
type = custom/script
interval = 5
format = <label>
exec = LC_TIME=en_US.UTF-8 date +"%a, %b %-d"
label-padding = 0
label-font = 1
click-left = gsimplecal

;==========================================================;
[module/screenshot]
type = custom/text
format = 󰻛
format-foreground = ${colors.secondary}
click-left = flameshot gui

;==========================================================;
[module/powermenu]
type = custom/text
format = 󰐥
format-foreground = ${colors.alert}
click-left = /home/fus/.config/bspwm/scripts/Helper-Power

;==========================================================;
[module/bluetooth]
type = custom/script
exec = /home/fus/.config/polybar/scripts/bluetooth.sh
interval = 3
click-left = blueman-manager &
click-right = bash -c 'if [ "$(bluetoothctl show | grep -i "Powered: yes")" ]; then bluetoothctl power off; else bluetoothctl power on; fi'

;==========================================================;
[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

;==========================================================;
[module/tray]
type = internal/tray
tray-spacing = 4px

[settings]
screenchange-reload = true
pseudo-transparency = true
